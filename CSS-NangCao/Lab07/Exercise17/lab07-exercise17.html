<body>
  <nav class="labbar">
    <a href="../index.html">&larr; Lab 07</a>
    <b>Exercise 7.17 — Filters</b>
    <a class="labbar-right" href="../../index.html">Trang chủ</a>
  </nav>

  <main class="lab-content">
    <p class="note">Cùng một ảnh được áp dụng các hàm <code>filter</code> khác nhau. Rê chuột lên ảnh để bỏ filter
      (có transition 0.5s).</p>

    <section class="filters">
      <figure><img src="../images/hoian.jpg" alt="" class="f-none"><figcaption>none</figcaption></figure>
      <figure><img src="../images/hoian.jpg" alt="" class="f-saturate"><figcaption>saturate(250%)</figcaption></figure>
      <figure><img src="../images/hoian.jpg" alt="" class="f-grayscale"><figcaption>grayscale(100%)</figcaption></figure>
      <figure><img src="../images/hoian.jpg" alt="" class="f-contrast"><figcaption>contrast(180%)</figcaption></figure>
      <figure><img src="../images/hoian.jpg" alt="" class="f-brightness"><figcaption>brightness(150%)</figcaption></figure>
      <figure><img src="../images/hoian.jpg" alt="" class="f-blur"><figcaption>blur(3px)</figcaption></figure>
      <figure><img src="../images/hoian.jpg" alt="" class="f-invert"><figcaption>invert(100%)</figcaption></figure>
      <figure><img src="../images/hoian.jpg" alt="" class="f-sepia"><figcaption>sepia(100%)</figcaption></figure>
      <figure><img src="../images/hoian.jpg" alt="" class="f-hue"><figcaption>hue-rotate(120deg)</figcaption></figure>
      <figure><img src="../images/hoian.jpg" alt="" class="f-opacity"><figcaption>opacity(40%)</figcaption></figure>
      <figure><img src="../images/hoian.jpg" alt="" class="f-shadow"><figcaption>drop-shadow(...)</figcaption></figure>
      <figure><img src="../images/hoian.jpg" alt="" class="f-combo"><figcaption>sepia + contrast + brightness</figcaption></figure>
    </section>
  </main>
</body>
</html>
